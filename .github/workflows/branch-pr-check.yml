name: Branch & PR Schema Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  verify-migrations-and-diffs:
    name: Verify Migrations & Schema Diffs
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: share_document
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install asyncpg psycopg2-binary alembic

      - name: Initialize base schema and run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/share_document
          DATABASE_SSL: false
        run: |
          python -m postgresql_db.schemas.setup_pbac_schema
          python -m postgresql_db.schemas.setup_graph_sync_schema
          python -m postgresql_db.schemas.notifications_schema
          python -m postgresql_db.schemas.sec_filing_schema
          if ls alembic/versions/*.py >/dev/null 2>&1; then
            alembic stamp head
            alembic upgrade head
          fi

          echo "[*] Database schema verification complete!"
